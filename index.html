<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><meta name="theme-color" content="#0f766e"><title>Strikewise Live – F&O learning dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16213a;--mute:#5d6882;--line:#dde2ea;--acc:#0f766e;--up:#15803d;--dn:#c2410c;--soft:#e6f2f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2130;--ink:#e8ecf4;--mute:#9aa6bf;--line:#2c3649;--acc:#2dd4bf;--up:#4ade80;--dn:#fb923c;--soft:#173a3a}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2130;--ink:#e8ecf4;--mute:#9aa6bf;--line:#2c3649;--acc:#2dd4bf;--up:#4ade80;--dn:#fb923c;--soft:#173a3a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:clamp(26px,5vw,40px);font-weight:800}h2{font-size:22px}h3{font-size:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1080px;margin:auto}
.logo{font:800 20px "Bricolage Grotesque",serif;color:var(--acc)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:6px 11px;border-radius:8px;color:var(--mute);text-decoration:none;white-space:nowrap;font-weight:500}
nav a.on{background:var(--soft);color:var(--acc)}
nav a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:18px 16px 40px}
.banner{background:var(--soft);border-left:4px solid var(--acc);padding:10px 14px;border-radius:6px;margin-bottom:18px;font-size:13.5px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.big{font:800 28px "Bricolage Grotesque",serif}.mute{color:var(--mute);font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13.5px}
.bar b{width:84px;font-weight:500}.bar i{height:14px;border-radius:3px;display:block}
.track{flex:1;display:flex;height:14px}.track>span{flex:1;display:flex}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{cursor:pointer;color:var(--mute);font-weight:600}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.ghost{background:transparent;color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}details p{margin:.6em 0 0;max-width:68ch}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag.bad{background:#fde8e1;color:#c2410c}.tag{white-space:nowrap;display:inline-block;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--acc);font-size:12px;font-weight:600}
footer{max-width:1080px;margin:auto;padding:0 16px 30px;color:var(--mute);font-size:12.5px}
svg{max-width:100%;height:auto}
</style>
</head>
<body>
<header><div class="top"><span class="logo">Strikewise</span>
<nav id="nav"></nav><span id="st" class="tag" aria-live="polite">Connecting…</span><button class="ghost" id="theme" aria-label="Toggle theme">Theme</button></div></header>
<main id="app"></main>
<footer>Strikewise is an educational tool. Data may be delayed, approximate or simulated and must not be used to place orders. It gives no advice or tips and has no order placement. Derivatives trading carries a high risk of loss.</footer>
<script>
const $=s=>document.querySelector(s);
let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const r=(a,b)=>a+(b-a)*rnd(),fmt=(n,d=2)=>n.toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:d});
const cls=n=>n>=0?'up':'dn',sg=n=>(n>=0?'+':'')+fmt(n);
const tabs=[['pulse','Pulse'],['sectors','Sectors'],['options','Options & OI'],['screener','Screeners'],['strength','Strength'],['dvm','DVM'],['fundamentals','Fundamentals'],['radar','Radar & news'],['journal','Journal'],['academy','Academy']];
// ---- live data
let idx=[],vix=0,adv=0,dec=0,sectors=[],stocks=[],strikes=[],events=[],news=[],meta={};
async function load(){try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();
({idx,vix,adv,dec,sectors,stocks,strikes,events,news}=d);meta=d;meta.err=false}catch(e){meta.err=true}status();return !meta.err}
function status(){const el=$('#st');if(!el)return;const age=meta.asOf?Math.round((Date.now()-new Date(meta.asOf))/1000):0;
const m=meta.err?'Offline':meta.stale?'Stale':meta.mode=='demo'?'Demo data':meta.mode=='live'?'Live':'Delayed '+(meta.delayMinutes||0)+' min';
el.textContent=m+(meta.asOf?' · updated '+(age<90?age+'s':Math.round(age/60)+'m')+' ago':'');el.className='tag'+(meta.err||meta.stale?' bad':'')}
// ---- views
const V={};
V.pulse=()=>{const flow=sectors.reduce((a,s)=>a+s.c,0)/sectors.length;
const score=Math.max(0,Math.min(100,50+(adv-dec)/218*40+flow*8-(vix-14)*3+idx[0].c*5));
const mood=score>60?'Risk-on':score<40?'Risk-off':'Neutral';
return `<h1>Market pulse</h1><p class="mute">A one-screen read of mood, indices, volatility and breadth.</p>
<div class="grid"><div class="card"><h3>Market mood</h3><div class="big ${score>=50?'up':'dn'}">${mood}</div><div class="mute">Score ${Math.round(score)}/100 from breadth, sector flow, NIFTY change and VIX.</div></div>
<div class="card"><h3>India VIX (sample)</h3><div class="big">${fmt(vix)}</div><div class="mute">Higher VIX means pricier options and larger expected swings.</div></div>
<div class="card"><h3>Breadth</h3><div class="big"><span class="up">${adv}</span> / <span class="dn">${dec}</span></div><div class="mute">Advancing vs declining F&O stocks.</div></div></div>
<h2 style="margin-top:20px">Indices and expected range</h2><div class="card scroll"><table><tr><th>Index</th><th>Level</th><th>Change %</th><th>IV %</th><th>1-day range</th><th>Weekly range</th></tr>
${idx.map(i=>{const d=i.p*i.iv/100/Math.sqrt(252),w=i.p*i.iv/100/Math.sqrt(52);return`<tr><td>${i.n}</td><td>${fmt(i.p)}</td><td class="${cls(i.c)}">${sg(i.c)}</td><td>${fmt(i.iv,1)}</td><td>${fmt(i.p-d,0)} – ${fmt(i.p+d,0)}</td><td>${fmt(i.p-w,0)} – ${fmt(i.p+w,0)}</td></tr>`}).join('')}</table></div>
<p class="mute">Range = level ± level × IV ÷ √(trading periods). It is a rough one-standard-deviation estimate, not a forecast.</p>`};
V.sectors=()=>{const m=Math.max(...sectors.map(s=>Math.abs(s.c)));const s=[...sectors].sort((a,b)=>b.c-a.c);
return `<h1>Sector money flow</h1><p class="mute">Which groups are seeing buying or selling pressure, with traded value in ₹ crore (sample).</p>
<div class="card">${s.map(x=>`<div class="bar"><b>${x.n}</b><div class="track"><span style="justify-content:flex-end">${x.c<0?`<i style="width:${Math.abs(x.c)/m*100}%;background:var(--dn)"></i>`:''}</span><span>${x.c>=0?`<i style="width:${x.c/m*100}%;background:var(--up)"></i>`:''}</span></div><span class="${cls(x.c)}" style="width:60px;text-align:right">${sg(x.c)}%</span><span class="mute" style="width:70px;text-align:right">₹${fmt(x.v,0)}</span></div>`).join('')}</div>
<p class="mute">Learn: rotation means money leaving one group and entering another. Strong sectors with rising turnover are leading the session.</p>`};
V.options=()=>{const tc=strikes.reduce((a,s)=>a+s.ce,0),tp=strikes.reduce((a,s)=>a+s.pe,0),pcr=tp/tc;
let mp=0,best=1e12;strikes.forEach(t=>{const pain=strikes.reduce((a,s)=>a+s.ce*Math.max(0,t.k-s.k)+s.pe*Math.max(0,s.k-t.k),0);if(pain<best){best=pain;mp=t.k}});
const res=[...strikes].sort((a,b)=>b.ce-a.ce)[0].k,sup=[...strikes].sort((a,b)=>b.pe-a.pe)[0].k,mx=Math.max(...strikes.map(s=>Math.max(s.ce,s.pe)));
const W=640,H=250,bw=W/strikes.length;
const svg=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Open interest by strike">${strikes.map((s,i)=>{const x=i*bw,h1=s.ce/mx*H,h2=s.pe/mx*H;return`<rect x="${x+4}" y="${H-h1}" width="${bw/2-5}" height="${h1}" fill="var(--dn)"/><rect x="${x+bw/2}" y="${H-h2}" width="${bw/2-5}" height="${h2}" fill="var(--up)"/><text x="${x+bw/2}" y="${H+16}" font-size="10" text-anchor="middle" fill="var(--mute)">${s.k}</text>`}).join('')}</svg>`;
return `<h1>Options & open interest</h1><p class="mute">A sample NIFTY option chain (open interest in thousands of contracts).</p>
<div class="grid"><div class="card"><h3>Put-call ratio</h3><div class="big">${fmt(pcr)}</div><div class="mute">Put OI ÷ call OI. Above 1 often reads as supportive, below 0.7 as cautious.</div></div>
<div class="card"><h3>Max pain</h3><div class="big">${mp}</div><div class="mute">Strike where option buyers collectively lose the most at expiry.</div></div>
<div class="card"><h3>Walls</h3><div class="big"><span class="up">${sup}</span> · <span class="dn">${res}</span></div><div class="mute">Highest put OI (support) · highest call OI (resistance).</div></div></div>
<div class="card" style="margin-top:14px"><div class="row"><span class="tag" style="color:var(--dn)">Calls</span><span class="tag" style="color:var(--up)">Puts</span></div><div class="scroll"><div style="min-width:520px">${svg}</div></div></div>
<h2 style="margin-top:20px">OI build-up guide</h2><div class="card scroll"><table><tr><th>Price</th><th>Open interest</th><th>Usual reading</th></tr><tr><td>Up</td><td>Up</td><td>Long build-up</td></tr><tr><td>Down</td><td>Up</td><td>Short build-up</td></tr><tr><td>Up</td><td>Down</td><td>Short covering</td></tr><tr><td>Down</td><td>Down</td><td>Long unwinding</td></tr></table></div>`};
let sk='rsi',sd=-1;
V.screener=()=>{const L=[...stocks].sort((a,b)=>sd*(b[sk]-a[sk]));
const th=(k,t)=>`<th data-k="${k}">${t}${sk==k?(sd<0?' ▼':' ▲'):''}</th>`;
return `<h1>Screeners</h1><p class="mute">Click a column to sort. Sample RSI, implied volatility and futures basis for practice stocks.</p>
<div class="card scroll"><table id="tbl"><tr><th>Stock</th>${th('p','Price')}${th('c','Change %')}${th('rsi','RSI')}${th('iv','IV %')}${th('basis','Basis %')}</tr>
${L.map(s=>`<tr><td>${s.n}</td><td>${fmt(s.p)}</td><td class="${cls(s.c)}">${sg(s.c)}</td><td>${fmt(s.rsi,0)} ${s.rsi>70?'<span class="tag" style="color:var(--dn)">overbought</span>':s.rsi<30?'<span class="tag">oversold</span>':''}</td><td>${fmt(s.iv,1)}</td><td>${sg(s.basis)}</td></tr>`).join('')}</table></div>
<p class="mute">RSI above 70 is often called overbought and below 30 oversold. High IV means expensive options. Positive basis means futures trade above spot.</p>`};
V.strength=()=>{const L=[...stocks].sort((a,b)=>b.rs-a.rs);
return `<h1>Strength & liquidity</h1><p class="mute">Relative strength versus NIFTY, with a liquidity score and a volatility regime (sample).</p>
<div class="card">${L.map(s=>{const reg=s.vol>2.4?'Volatile':'Calm';return`<div class="bar"><b style="width:110px">${s.n}</b><div class="track" style="background:var(--line);border-radius:3px"><i style="width:${s.liq}%;background:${s.rs>=0?'var(--up)':'var(--dn)'};opacity:.85"></i></div><span class="${cls(s.rs)}" style="width:64px;text-align:right">${sg(s.rs)}%</span><span class="tag" style="width:70px;text-align:center">${reg}</span></div>`}).join('')}</div>
<p class="mute">Bar length is the liquidity score (0–100). Colour shows outperforming (green) or lagging (orange) NIFTY. Thin liquidity means wider spreads and harder exits.</p>`};
// ---- DVM: transparent first-pass momentum score; fundamentals remain unavailable until licensed history is connected
const percentile=(values,value)=>{const sorted=[...values].sort((a,b)=>a-b);let lo=0,hi=sorted.length;while(lo<hi){const mid=(lo+hi)>>1;if(sorted[mid]<=value)lo=mid+1;else hi=mid;}return sorted.length<2?50:(lo-1)/(sorted.length-1)*100};
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const dvmRows=()=>stocks.map(s=>{
 const p=percentile(stocks.map(x=>x.c),s.c);
 const rs=percentile(stocks.map(x=>x.rs),s.rs);
 const rsi=clamp(100-Math.abs(s.rsi-55)*4);
 const momentum=Math.round(p*.4+rs*.4+rsi*.2);
 return {...s,momentum};
}).sort((a,b)=>b.momentum-a.momentum);
V.dvm=()=>{const rows=dvmRows();const avg=rows.length?Math.round(rows.reduce((a,s)=>a+s.momentum,0)/rows.length):0;
return `<h1>DVM scorecard</h1><p class="mute">Durability · Valuation · Momentum. Independent, transparent scores — not Trendlyne's proprietary formula.</p>
<div class="grid">
 <div class="card"><h3>Momentum</h3><div class="big">${avg}<span class="mute"> / 100</span></div><div class="mute">Average of available sample-stock momentum scores.</div></div>
 <div class="card"><h3>Durability</h3><div class="big">—</div><div class="mute">Awaiting verified multi-year financial statements and consistency data.</div></div>
 <div class="card"><h3>Valuation</h3><div class="big">—</div><div class="mute">Awaiting verified earnings, book value and sector/history multiples.</div></div>
</div>
<div class="card" style="margin-top:14px"><h2>Stock-level DVM</h2><p class="mute">Momentum = 40% cross-sectional price-change percentile + 40% relative-strength percentile + 20% RSI positioning score. Durability and Valuation are intentionally blank; no combined DVM grade is shown until all three pillars are supported.</p>
<div class="scroll"><table><tr><th>Stock</th><th>Momentum</th><th>Durability</th><th>Valuation</th><th>Coverage</th></tr>
${rows.map(s=>`<tr><td><b>${s.n}</b></td><td class="${s.momentum>=60?'up':s.momentum<40?'dn':''}">${s.momentum}</td><td>—</td><td>—</td><td><span class="tag">Momentum only</span></td></tr>`).join('')}</table></div></div>
<p class="mute">Data status: ${meta.mode||'unknown'} · ${meta.asOf?'Updated '+new Date(meta.asOf).toLocaleString('en-IN'):'timestamp unavailable'}. Percentile scores are relative to this displayed universe and will change when the universe changes. This is an educational research aid, not investment advice.</p>`};

V.fundamentals=()=>`<h1>Fundamental analysis</h1>
<p class="mute">Company financials, ratios, ownership and corporate actions from Upstox. Enter the company's 12-character ISIN to retrieve its reports.</p>
<div class="card">
 <div class="row"><input id="fundIsin" maxlength="12" placeholder="ISIN e.g. INE002A01018" aria-label="Company ISIN" style="flex:1;text-transform:uppercase">
 <select id="fundType" aria-label="Statement type"><option value="consolidated">Consolidated</option><option value="standalone">Standalone</option></select>
 <select id="fundPeriod" aria-label="Reporting period"><option value="yearly">Yearly</option><option value="quarterly">Quarterly</option></select>
 <button id="fundLoad">Load company</button></div>
 <p id="fundStatus" class="mute" aria-live="polite">Fundamental data is fetched on demand and cached for six hours.</p>
</div>
<div id="fundOutput" class="card" style="margin-top:14px;display:none"><h2>Upstox response</h2><p class="mute">Raw source data is shown transparently for this first integration pass. Missing endpoints are listed separately; values are not estimated.</p><pre id="fundJson" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:650px;overflow:auto"></pre></div>
<p class="mute">Important: financial data may be consolidated or standalone and annual or quarterly. Always check the reporting period and data availability. This is a research/education tool, not investment advice.</p>`;
V.radar=()=>`<h1>Radar & news</h1><p class="mute">Practice feed of unusual moves, plus learning reads.</p>
<div class="grid"><div class="card"><h3>Intraday radar</h3>${events.map(e=>`<p style="margin:.5em 0">• ${e}</p>`).join('')}</div>
<div class="card"><h3>Learning reads</h3>${news.map(e=>`<p style="margin:.5em 0">• ${e}</p>`).join('')}</div></div>`;
V.journal=()=>{let j=[];try{j=JSON.parse(localStorage.getItem('sw-journal')||'[]')}catch(e){}
return `<h1>Practice journal</h1><p class="mute">Log what you learned or a paper idea. Saved only in this browser. Nothing is uploaded and no orders exist here.</p>
<div class="card"><div class="row"><input id="jt" placeholder="Symbol or topic" aria-label="Symbol or topic"><select id="jk" aria-label="Type"><option>Lesson</option><option>Paper idea</option><option>Mistake</option></select></div>
<textarea id="jn" rows="3" style="width:100%" placeholder="What happened, and what will you do differently?" aria-label="Notes"></textarea><div class="row" style="margin-top:8px"><button id="jadd">Save entry</button><button class="ghost" id="jclr">Clear all</button></div></div>
<div style="margin-top:14px" id="jl">${j.length?j.map(e=>`<div class="card" style="margin-bottom:8px"><span class="tag">${e.k}</span> <b>${e.t||'Untitled'}</b> <span class="mute">${e.d}</span><p style="margin:.4em 0 0">${e.n}</p></div>`).join(''):'<p class="mute">No entries yet. Add your first note above.</p>'}</div>`};
const lessons=[['Futures vs options','A future is an obligation to buy or sell at a fixed price on expiry. An option is a right, not an obligation. Buyers pay a premium and can lose at most that premium. Sellers collect it and can face much larger losses.'],
['Open interest','Open interest counts contracts still open. Read it with price: price up with OI up suggests long build-up; price down with OI up suggests short build-up.'],
['Option Greeks','Delta is premium change per unit move in the underlying. Theta is daily time decay. Vega is sensitivity to volatility. Gamma is how fast delta changes. Option buyers lose a little to theta every day.'],
['Implied volatility and VIX','IV is the market’s expected size of future moves, taken from option prices. India VIX summarises it for NIFTY options. Buying options when IV is high means paying more for the same move.'],
['Put-call ratio and max pain','PCR compares put and call open interest. Max pain is the strike where option buyers collectively lose most at expiry. Both are context, not signals, and neither predicts price.'],
['Risk first','Studies by India’s market regulator found most individual F&O traders lose money. Size positions so one loss is survivable, define your exit before entering, and never use money you need.']];
V.academy=()=>`<h1>F&O Academy</h1><p class="mute">Short lessons behind every chart, plus a quick check.</p>${lessons.map(l=>`<details><summary>${l[0]}</summary><p>${l[1]}</p></details>`).join('')}
<h2 style="margin-top:20px">Quick check</h2><div class="card"><p id="qq"><b>Price falls while open interest rises. What is the usual reading?</b></p><div class="row" id="qa"><button class="ghost" data-a="0">Long build-up</button><button class="ghost" data-a="1">Short build-up</button><button class="ghost" data-a="2">Short covering</button></div><p id="qr" class="mute" aria-live="polite"></p></div>`;
// ---- router
function go(){if(!meta.asOf&&!meta.err&&!['journal','academy'].includes((location.hash||'#pulse').slice(1))){$('#app').innerHTML='<p class="mute">Loading data…</p>';return load().then(go)}const h=(location.hash||'#pulse').slice(1),t=V[h]?h:'pulse';
$('#nav').innerHTML=tabs.map(([k,n])=>`<a href="#${k}" class="${k==t?'on':''}">${n}</a>`).join('');
$('#app').innerHTML=`<div class="banner"><b>For learning only.</b> Check the status tag at the top for data mode and age. Never trade from this page.${meta.announcement?'<br>'+String(meta.announcement).replace(/</g,'&lt;'):''}</div>`+V[t]();bind(t);scrollTo(0,0)}
function bind(t){

if(t=='fundamentals'){
 const btn=$('#fundLoad'), isin=$('#fundIsin'), status=$('#fundStatus'), out=$('#fundOutput'), pre=$('#fundJson');
 btn.onclick=async()=>{
  const code=isin.value.trim().toUpperCase(); isin.value=code;
  if(!/^[A-Z]{2}[A-Z0-9]{10}$/.test(code)){status.textContent='Please enter a valid 12-character ISIN.';return}
  btn.disabled=true;status.textContent='Fetching company fundamentals from Upstox…';out.style.display='none';
  try{
   const q=new URLSearchParams({isin:code,type:$('#fundType').value,period:$('#fundPeriod').value});
   const res=await fetch('/api/fundamentals?'+q.toString(),{cache:'no-store'}), data=await res.json();
   if(!res.ok)throw new Error(data.error||'Fundamental data unavailable.');
   pre.textContent=JSON.stringify(data,null,2);out.style.display='block';
   const missing=Object.keys(data.errors||{});
   status.textContent='Retrieved '+Object.keys(data.data||{}).length+' data sections · '+new Date(data.asOf).toLocaleString('en-IN')+(missing.length?' · unavailable: '+missing.join(', '):'');
  }catch(e){status.textContent=e.message}
  finally{btn.disabled=false}
 };
 isin.oninput=()=>{isin.value=isin.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12)};
}
\nif(t=='screener')document.querySelectorAll('#tbl th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;sd=sk==k?-sd:-1;sk=k;go()});
if(t=='journal'){$('#jadd').onclick=()=>{const n=$('#jn').value.trim();if(!n)return;let j=[];try{j=JSON.parse(localStorage.getItem('sw-journal')||'[]')}catch(e){}
