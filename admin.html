<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Strikewise admin</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#16213a;--mute:#5d6882;--line:#dde2ea;--acc:#0f766e;--dn:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2130;--ink:#e8ecf4;--mute:#9aa6bf;--line:#2c3649;--acc:#2dd4bf;--dn:#fb923c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:560px;margin:auto}h1{font-size:24px;margin:8px 0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
button{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;cursor:pointer;margin-top:12px}button.ghost{background:transparent;color:var(--acc)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}dt{color:var(--mute)}dd{margin:0;text-align:right;word-break:break-word}
#msg{min-height:22px;font-weight:600}.err{color:var(--dn)}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}</style></head><body><main>
<h1>Strikewise admin</h1><p id="msg" aria-live="polite"></p>
<div id="login" class="card" hidden><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password"><button id="go">Sign in</button></div>
<div id="panel" hidden>
<div class="card"><dl id="info"></dl><button class="ghost" id="rf">Refresh data now</button></div>
<div class="card"><label for="prov">Data provider</label><select id="prov"><option value="demo">demo (simulated)</option><option value="licensed">licensed (your API)</option></select>
<label for="ref">Refresh interval (seconds, 5 to 3600)</label><input id="ref" type="number" min="5" max="3600">
<label for="ann">Notice shown to visitors (optional)</label><textarea id="ann" rows="2" maxlength="240"></textarea>
<button id="save">Save settings</button><p class="mute" style="color:var(--mute);font-size:13px">Settings reset when the server restarts. Set REFRESH_SECONDS and PROVIDER on your host to make them permanent.</p></div>
<button class="ghost" id="out">Sign out</button></div></main>
<script>
const $=s=>document.querySelector(s),msg=(t,e)=>{$('#msg').textContent=t;$('#msg').className=e?'err':''};
const api=async(p,b)=>{const r=await fetch('/api/admin/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{code:r.status});return d};
const row=(k,v)=>`<dt>${k}</dt><dd></dd>`;
async function show(){try{const d=await api('status');$('#login').hidden=true;$('#panel').hidden=false;
const rows=[['Provider',d.settings.provider],['Data mode',d.mode+(d.mode=='delayed'?' ('+d.delayMinutes+' min)':'')],['Last data',d.asOf?new Date(d.asOf).toLocaleString():'none yet'],['Cache age',d.cacheAgeSec==null?'-':d.cacheAgeSec+'s'],['Successful fetches',d.stats.fetches],['Errors',d.stats.errors],['Last error',d.stats.lastError||'none'],['Server started',new Date(d.stats.started).toLocaleString()]];
$('#info').innerHTML=rows.map(r=>row(...r)).join('');$('#info').querySelectorAll('dd').forEach((e,i)=>e.textContent=rows[i][1]);
$('#prov').value=d.settings.provider;$('#ref').value=d.settings.refresh;$('#ann').value=d.settings.announcement}
catch(e){$('#panel').hidden=true;$('#login').hidden=false;if(e.code!==401)msg(e.message,1)}}
$('#go').onclick=async()=>{try{await api('login',{password:$('#pw').value});$('#pw').value='';msg('');show()}catch(e){msg(e.message,1)}};
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
$('#rf').onclick=async()=>{try{await api('refresh',{});msg('Data refreshed');show()}catch(e){msg(e.message,1);show()}};
$('#save').onclick=async()=>{try{await api('settings',{provider:$('#prov').value,refresh:+$('#ref').value,announcement:$('#ann').value});msg('Saved');show()}catch(e){msg(e.message,1)}};
$('#out').onclick=async()=>{await api('logout',{});show()};
show();
</script></body></html>
